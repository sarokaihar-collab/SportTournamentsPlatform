name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SportTournamentsPlatform.sln

      - name: Build solution
        run: dotnet build SportTournamentsPlatform.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/SportTournaments.UnitTests/SportTournaments.UnitTests.csproj --configuration Release --no-build --no-restore